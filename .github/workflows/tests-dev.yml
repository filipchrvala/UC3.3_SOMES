name: Run tests on dev branch

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  packages: write

jobs:
  run-tests-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Pip install packages
        run: |
          python -m pip install -U pip
          pip install --no-cache-dir domino-py[cli]

      - name: Install Tests Dependencies
        run: pip install -r requirements-tests.txt

      # Harbor/SPICE images are built by GitLab CI. On GitHub this repo's
      # config.toml points at Harbor, so ghcr.io + harbor path dry-runs fail.
      # Unit tests only (tests/, not pieces/*/test_* piece_dry_run).
      - name: Run unit tests
        run: |
          pytest tests/ --cov=pieces --cov-report=xml --cov-report=term-missing
